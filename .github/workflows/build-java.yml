# This is a basic workflow to help you get started with Actions
name: Build Backend App

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ master ]
    tags:
      - '*'
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: Web and Java build
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:dind
        options: --privileged --shm-size=2g
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock:ro
    #env:
    #  JAVA_VERSION: "11.0"
    #  FLUTTER_VERSION: "2.5.3"
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
     # - name: Set up JDK 21
     #   uses: actions/setup-java@v4
     #   with:
     #     java-version: '21'
     #     distribution: 'corretto'
     #     cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set default version
        id: set_base_version
        run: |
          echo "TAG_NAME=0.0.1" >> $GITHUB_ENV
      - name: Extract tag name
        id: extract_tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "TAG_NAME=${TAG:-1.0.0}" >> $GITHUB_ENV
      # Build web app
      - name: Build version
        run: echo "Building web ${TAG_NAME}:${{ github.run_number }}"
      # Build web app
      - name: build web
        working-directory: src/main/app
        run: |
         nix-shell --run "flutter build web --release --wasm --build-name ${TAG_NAME} --build-number ${{ github.run_number }} " ../../../shell.nix
         cp -R build/web ../resources/public
      # build backend

      - name: Set application version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          nix-shell --run "mvn versions:set -DnewVersion=${{ env.TAG_NAME }}"
          nix-shell --run "mvn versions:commit"
      - name: Build Java app
        run: nix-shell --run "mvn clean install"

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          file: docker/Dockerfile
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/newsku:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/newsku:dev

      - name: Build and push Docker image (Release)
        uses: docker/build-push-action@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          file: docker/Dockerfile
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/newsku:latest
            ${{ secrets.DOCKER_USERNAME }}/newsku:${{ env.TAG_NAME }}
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GH_TOKEN }}
          file: target/newsku-*.jar
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

