server:
 # tomcat:
 #   threads:
 #     max: 8
  port: 8080
spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 50
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_DATABASE:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    mcp:
      server:
        name: newsku
        version: 1.0.0
        type: sync
        # stateless: each request is authenticated on its own with an API key, no session needed
        protocol: stateless
        instructions: >-
          Newsku is an RSS reader that ranks articles by importance using the user's preferences.
          Use these tools to read the user's news.
        streamable-http:
          # under /api/ so it goes through the API key / JWT authentication
          mcp-endpoint: /api/mcp

 # jpa:
 #   show-sql: true
 #   properties:
 #     hibernate:
 #       format_sql: true
logging:
  level:
    org.springframework.boot.autoconfigure.flyway: DEBUG
    org.flywaydb: DEBUG
